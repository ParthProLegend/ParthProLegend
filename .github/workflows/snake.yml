name: Generate Snake GIF and SVG
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: ParthProLegendForks/snk@v3
        id: snake
        with:
          github_user_name: ParthProLegend
          outputs: |
            dist/github-contribution-grid-snake-light.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      # Deploy to GitHub Pages
      - uses: ParthProLegendForks/ghaction-github-pages@v2.1.3
        with:
          target_branch: snake_gif
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}